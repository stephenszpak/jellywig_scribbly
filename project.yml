name: Scribbly
options:
  bundleIdPrefix: com.scribbly
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
targets:
  Scribbly:
    type: application
    platform: iOS
    sources:
      - path: Scribbly
        excludes:
          - "Resources/ColoringPages/**"
          - "**/*.example"
      - path: Scribbly/Resources/ColoringPages
        type: folder
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scribbly.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Scribbly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [ScribblyTests]
  ScribblyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScribblyTests]
    dependencies:
      - target: Scribbly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scribbly.tests
        GENERATE_INFOPLIST_FILE: YES
